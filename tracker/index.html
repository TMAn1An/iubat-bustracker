<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b7a1c">
<title>Bus Tracker · Driver Phone</title>
<link rel="icon" type="image/png" href="../assets/icons/favicon-48.png">
<meta name="robots" content="noindex">
<style>
  :root { --green:#0b6e1c; --green-700:#095a17; --ink:#17211b; --red:#d92d20; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:"Inter",system-ui,sans-serif; background:#f5f6f3; color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; }
  .card { background:#fff; border:1px solid #e4e8e2; border-radius:16px; padding:28px 24px; width:min(380px,100%); box-shadow:0 2px 4px rgba(16,24,20,.05),0 10px 28px rgba(16,24,20,.08); display:flex; flex-direction:column; gap:14px; align-items:center; }
  img { width:64px; }
  h1 { margin:0; font-size:19px; font-weight:650; }
  p { margin:0; color:#6b766f; font-size:14px; line-height:1.5; }
  .ico { width:84px; height:84px; border-radius:20px; background:#eef5ee; border:1px solid #dcebdd; display:grid; place-items:center; color:var(--green); }
  .ico svg { width:42px; height:42px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #st { font-size:16px; font-weight:600; display:flex; align-items:center; gap:8px; min-height:24px; }
  #st::before { content:""; width:9px; height:9px; border-radius:50%; background:#9aa29b; }
  #st.live::before { background:#17a34a; box-shadow:0 0 0 4px rgba(23,163,74,.18); }
  #st.bad::before { background:var(--red); }
  #meta { color:#6b766f; font-size:13.5px; line-height:1.7; min-height:46px; }
  button, input { font:inherit; border-radius:10px; font-size:16px; width:100%; }
  input { border:1px solid #cfd6cd; padding:12px 14px; text-align:center; color:var(--ink); }
  input:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(11,110,28,.14); }
  button { border:0; padding:13px 18px; font-weight:600; background:var(--green); color:#fff; cursor:pointer; }
  button:hover { background:var(--green-700); }
  button.stop { background:#fff; color:var(--red); border:1px solid #fecdca; }
  button.link { background:none; color:#6b766f; font-size:13px; font-weight:500; padding:6px; }
  form { display:flex; flex-direction:column; gap:12px; width:100%; }
  small { color:#8a938c; max-width:340px; font-size:12.5px; line-height:1.5; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
  <div class="card">
    <img src="../assets/logo.png" alt="">
    <h1>Driver phone · location sharing</h1>

    <form id="setup">
      <p>Enter the bus token given by the admin (needed only once)</p>
      <input id="tok" placeholder="Bus token" autocomplete="off" required>
      <button>Save</button>
    </form>

    <section id="run" hidden style="display:flex;flex-direction:column;gap:14px;align-items:center;width:100%">
      <div class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 18v2M16 18v2"/><circle cx="8.5" cy="14.5" r=".6" fill="currentColor"/><circle cx="15.5" cy="14.5" r=".6" fill="currentColor"/></svg></div>
      <div id="st">Not sharing</div>
      <div id="meta"></div>
      <button id="go">Start sharing</button>
      <button id="reset" class="link">Change token</button>
    </section>
  </div>
  <small>Tip: keep the phone charging with the screen on. If the screen turns off, the browser may pause GPS.</small>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const KEY = 'iubat_bus_token', API = location.pathname.replace(/tracker\/?(index\.html)?$/, '') + 'api/track';
  const MIN_GAP = 10000;            // send every 10 s: saves battery, data and the free hosting quota (the app fills the gaps)
  let token = (() => { try { return localStorage.getItem(KEY); } catch { return null; } })();
  const fromUrl = new URLSearchParams(location.search).get('key');
  if (fromUrl) { token = fromUrl; try { localStorage.setItem(KEY, token); } catch {} history.replaceState(null, '', location.pathname); }

  let watch = null, wake = null, last = 0, sent = 0, fails = 0, pending = null, timer = null;
  const setSt = (t, c) => { const e = $('#st'); e.textContent = t; e.className = c || ''; };
  const show = () => { $('#setup').hidden = !!token; $('#run').hidden = !token; };
  $('#setup').onsubmit = e => { e.preventDefault(); token = $('#tok').value.trim(); try { localStorage.setItem(KEY, token); } catch {} show(); };
  $('#reset').onclick = () => { stop(); token = null; try { localStorage.removeItem(KEY); } catch {} show(); };
  $('#go').onclick = () => (watch === null ? start() : stop());

  async function lock() { try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && watch !== null) lock(); });

  function start() {
    if (!('geolocation' in navigator)) { setSt('GPS is not available in this browser', 'bad'); return; }
    lock();
    $('#go').textContent = 'Stop sharing'; $('#go').classList.add('stop'); setSt('Searching for GPS…');
    watch = navigator.geolocation.watchPosition(onFix, onErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    timer = setInterval(flush, 1000);
  }
  function stop() {
    if (watch !== null) navigator.geolocation.clearWatch(watch); watch = null; clearInterval(timer); lastPos = null;
    try { wake && wake.release(); } catch {} wake = null;
    $('#go').textContent = 'Start sharing'; $('#go').classList.remove('stop'); setSt('Not sharing');
  }
  let lastPos = null;
  function onFix(p) { pending = p; lastPos = p; flush(); }
  function onErr(e) { setSt(e.code === 1 ? 'Please allow location access' : 'No GPS signal', 'bad'); }

  async function flush() {
    // a parked/waiting bus gets no new GPS events: re-send the last fix so it does not look offline
    const pos = pending || lastPos;
    if (!pos || Date.now() - last < MIN_GAP) return;
    const { coords: c } = pos, timestamp = pending ? pending.timestamp : Date.now(); pending = null; last = Date.now();
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, keepalive: true,
        body: JSON.stringify({ token, lat: c.latitude, lng: c.longitude, speed: c.speed ?? undefined, heading: c.heading ?? undefined, acc: c.accuracy, ts: timestamp }) });
      if (r.status === 401) { setSt('Invalid token', 'bad'); return; }
      if (!r.ok) throw new Error(r.status);
      sent++; fails = 0;
      setSt('Live · sending location', 'live');
      $('#meta').innerHTML = `Sent ${sent} time${sent === 1 ? '' : 's'} · accuracy ±${Math.round(c.accuracy)} m<br>Speed ${c.speed != null ? Math.round(c.speed * 3.6) : '–'} km/h · ${new Date().toLocaleTimeString('en-GB')}`;
    } catch { fails++; setSt('Network problem, retrying…', 'bad'); }
  }
  show();
})();
</script>
</body>
</html>
